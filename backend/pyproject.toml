[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nyaya-backend"
version = "1.0.0"
description = "Nyaya – Indian Legal AI Assistant Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.5.0",
    "fastembed>=0.3.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    "openai>=1.30",
    "anthropic>=0.28",
    "google-generativeai>=0.7",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3", "Pillow>=10.0", "ocrmypdf>=16.0"]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

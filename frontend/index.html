<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalRAG | AI Legal Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --color-bg: #FAF8F3;
      --color-text: #1F2420;
      --color-accent: #7C2D1D;
      --color-accent-hover: #9A3B29;
      --color-border: #E5E7EB;
      --font-serif: 'Noto Serif', serif;
      --font-sans: 'Noto Sans', sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --color-bg: #1F2420;
        --color-text: #FAF8F3;
        --color-accent: #9A3B29;
        --color-accent-hover: #7C2D1D;
        --color-border: #374151;
      }
    }

    :root[data-theme="dark"] {
      --color-bg: #1F2420;
      --color-text: #FAF8F3;
      --color-accent: #9A3B29;
      --color-accent-hover: #7C2D1D;
      --color-border: #374151;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-serif {
      font-family: var(--font-serif);
    }

    .text-body {
      font-family: var(--font-sans);
    }

    /* Custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: var(--color-accent);
    }

    /* Fade in animation */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeIn 0.5s ease forwards;
    }

    .fade-in-1 { animation-delay: 0.1s; }
    .fade-in-2 { animation-delay: 0.2s; }
    .fade-in-3 { animation-delay: 0.3s; }

    /* Card hover effects */
    .card-hover:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
    }

    /* Loading spinner */
    .spinner {
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-top-color: var(--color-accent);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Legal document styling */
    .legal-doc {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 40px;
    }

    /* Citation chip */
    .citation-chip {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(124, 45, 29, 0.1);
      color: var(--color-accent);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .citation-chip:hover {
      background: rgba(124, 45, 29, 0.2);
    }

    /* Language selector */
    .lang-selector button {
      transition: all 0.2s;
    }

    .lang-selector button.active {
      background: var(--color-accent);
      color: white;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
